armor_detector: #该参数已是最优解
  armor_infer:
    model_type: tup
    conf_threshold: 0.2
  net_detector:
    backend: openvino
    openvino:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      device_name: "GPU"
      perf_mode: "THROUGHPUT"
      priority: "HIGH"
      # scheduling_core_type: "PCORE_ONLY"
      execution_mode: "PERFORMANCE"
      infer_request_buffer_num: 10
    tensorrt:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      copy_context_num: 3
      min_free_mem_ratio: 0.1
      use_cuda_preproces: true
  number_classifier:
    enable: true
    model_path: ${ROOT_DIR}/model/mlp.onnx
    label_path: ${ROOT_DIR}/model/label.txt
  color_classifier:
    enable: true
    diff_threshold: 10.0
  cv:
    light:
      bin_threshold: 120.0
      min_wh_ratio: 0.001
      max_wh_ratio: 0.4
      max_angle: 40.0
    armor:
      min_ratio: 0.8
      max_ratio: 5.0

armor_tracker:
  lost_time_thres: 0.5
  lost_time_thres_outpost: 2.0
  tracking_thres: 10
  match_gate_armor: 50.0
  match_gate_not_all_init_armor: 100.0
  qxyz_common: [30.0, 30.0, 1.0]
  qyaw_common: 100.0
  qxyz_output: [1.0, 1.0, 0.5]
  qyaw_output: 0.01
  q_r: 0.0000001
  q_l: 0.0000001
  q_h: 0.0000001
  q_outpost_dz: 0.01
  enable_lights_measure: true
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  # 位置门: 两端误差之和不得超过预测灯条长度的这个倍数。5.0 时门比相邻装甲板的灯条间距还宽。
  light_match_pos_gate_by_length_ratio: 1.5
  # 新息门控阈值 = 该系数 × 卡方 0.999 分位数(4 维观测 18.467)。0 为关闭。
  innovation_gate_chi2_scale: 1.0
  r_uv_at_1m: 70.0
  r_uv_min: 30.0
  esekf_iter_num: 5

auto_aim_fsm: #多种瞄准模式target vyaw控制阈值 single：目标速度小锁定较优板 whole： 锁定全部板 pair： 4选2 center：瞄准中心
  single_whole_up: 1.5 
  single_whole_down: 1.0
  whole_pair_up: 3.5 
  whole_pair_down: 2.5 #1s内至少换2次板子  2pi  否则轨迹规划无意义
  pair_center_up: 16.5
  pair_center_down: 15.0
  transfer_time: 0.5

armor_aimer:
  base_yaw_offset: -0.0 # yaw补偿
  base_pitch_offset: -0.2 # pitch补偿 两个都调好理论上发出弹丸会与可视化弹道重现重合，可以在没有靶车的时候临时调整
  # base_yaw_offset: -0.0
  # base_pitch_offset: -0.0
  sample_total_time: 1.0
  sample_horizon: 200
  fire_delay_min: 0.01
  fire_delay_max: 0.05
  max_yaw_acc: 40
  max_pitch_acc: 50
  prediction_delay: 0.00
  aim_center_more_prediction_time: 0.0
  shooting_range_h: 0.12
  shooting_range_w_small: 0.12
  shooting_range_w_large: 0.24
  min_enable_pitch_deg: 0.25
  min_enable_yaw_deg: 0.25
  ballistic_trajectory:
    gravity: 9.8
    resistance_full: 0.092 # 0.019
    compenstator_type: resistance_full

mqtt:
  enable: true
  server: "tcp://127.0.0.1:3333"
  client_id: "encoder_hero"
  topic: "CustomByteBlock"

encoder:
  # ----- 编码器参数 -----
  fps: 30                       # 输出帧率
  target_bitrate: 70           # 目标比特率（kbps）
  max_packets_per_sec: 50       # 每秒最大包数（令牌桶速率）

  # ----- 图像预处理参数 -----
  crop_size: 350                # 中心裁剪区域大小
  output_w: 300                 # 编码输出宽度
  output_h: 300                 # 编码输出高度
  static_simplify: true         # 开启动静分离
  motion_threshold: 14          # 运动检测阈值
  motion_erode_px: 2            # 腐蚀
  motion_dilate_px: 6           # 膨胀
  motion_trail_frames: 0        # 拖影历史帧数，0 表示关闭
  trail_disable_motion_ratio: 0.01   # 拖影抑制运动比例阈值
  bg_update_alpha: 0.01         # 背景更新速度
  bg_blur_sigma: 0.1            # 静态模糊强度
  center_clear_size: 200        # 中心保护区域尺寸
  force_monochrome: false        # 仅中心保留彩色

    