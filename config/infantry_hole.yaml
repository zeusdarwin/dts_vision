armor_detector:
  max_infer_num: 5
  backend: tensorrt
  net_detector:
    openvino:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      device_name: "GPU"
      perf_mode: "THROUGHPUT"
      priority: "HIGH"
      # scheduling_core_type: "PCORE_ONLY"
      execution_mode: "PERFORMANCE"
      infer_request_buffer_num: 10
    tensorrt:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      copy_context_num: 3
      min_free_mem_ratio: 0.1
      use_cuda_preproces: true
    armor_infer:
      model_type: tup
      conf_threshold: 0.2
  number_classifier:
    enable: true
    model_path: ${ROOT_DIR}/model/mlp.onnx
    label_path: ${ROOT_DIR}/model/label.txt
  color_classifier:
    enable: true
    diff_threshold: 20.0
  cv:
    light:
      bin_threshold: 120.0
      net_ref_threshold_tol: 50.0
      min_wh_ratio: 0.001
      max_wh_ratio: 0.4
      max_angle: 40.0
    armor:
      min_ratio: 0.8
      max_ratio: 5.0

armor_tracker:
  lost_time_thres: 1.5
  lost_time_thres_outpost: 2.0
  tracking_thres: 3
  qxyz_common: [10.0, 10.0, 1.0]
  qyaw_common: 10.0
  qxyz_output: [1.0, 1.0, 1.0]
  qyaw_output: 0.01
  q_r: 0.0000001
  q_l: 0.0000001
  q_h: 0.0000001
  q_wpr: 0.0000001
  q_outpost_dz: 0.0000001
  enable_lights_measure: true
  armor_match_gate: 1300.0
  armor_match_gate_not_all_init: 1000.0
  armor_match_w_center_err: 5.0
  armor_match_w_angle_err: 10.0
  armor_match_w_side_length_err: 1.0
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  # 位置门: 两端误差之和不得超过预测灯条长度的这个倍数。
  # 原来是 5.0, 在 3m 处约 162px, 而相邻装甲板(r≈0.25m)的灯条间距只有约 147px,
  # 门比它要分辨的间距还宽, 一根灯条可以合法地配到差 90° 的邻板上。
  light_match_pos_gate_by_length_ratio: 1.5
  # 新息门控阈值 = 该系数 × 卡方 0.999 分位数(4 维观测 18.467)。0 为关闭。
  innovation_gate_chi2_scale: 1.0
  r_sigma_px_by_length_ratio: 3.0
  r_sigma_length_by_length_ratio: 6.5
  r_sigma_angle: 6.5
  r_sigma_armor_lights_depth_diff: 1.3
  esekf_iter_num: 5

# r_sigma_px_by_length_ratio: 0.2
# r_sigma_length_by_length_ratio: 0.5
# r_sigma_angle: 0.5
# r_sigma_armor_lights_depth_diff: 0.1
# esekf_iter_num: 5

auto_aim_fsm:
  single_whole_up: 1.5 
  single_whole_down: 1.0
  whole_pair_up: 10.5 
  whole_pair_down: 9.5 #1s内至少换2次板子  2pi  否则轨迹规划无意义
  pair_center_up: 16.5
  pair_center_down: 15.0
  transfer_time: 0.5

armor_aimer:
  type: mpc #limit/mpc
  base_yaw_offset: -0.5
  base_pitch_offset: -1
  # base_yaw_offset: -0.0
  # base_pitch_offset: -0.0
  sample_total_time: 1.0
  sample_horizon: 200
  fire_delay_min: 0.005
  fire_delay_max: 0.025
  max_yaw_acc: 20
  max_pitch_acc: 25
  prediction_delay: 0.00
  aim_center_more_prediction_time: 0.0
  shooting_range_h: 0.12
  shooting_range_w_small: 0.12
  shooting_range_w_large: 0.24
  min_enable_pitch_deg: 0.25
  min_enable_yaw_deg: 0.25
  ballistic_trajectory:
    gravity: 9.8
    resistance: 0.092  # 0.0190(大弹丸)double k1_c = 0.47; double k1 = k1_c * 1.169 * (2 * M_PI * 0.02125 * 0.02125) / 2 / 0.041;
    compenstator_type: resistance
 
rune_detector:
  max_infer_num: 5
  backend: tensorrt
  net_detector:
    openvino:
      model_path: ${ROOT_DIR}/model/cb_rune.onnx
      device_name: "GPU"
      perf_mode: "THROUGHPUT"
      priority: "HIGH"
      # scheduling_core_type: "PCORE_ONLY"
      execution_mode: "PERFORMANCE"
      infer_request_buffer_num: 10
    tensorrt:
      model_path: ${ROOT_DIR}/model/cb_rune.onnx
      copy_context_num: 3
      min_free_mem_ratio: 0.1
      use_cuda_preproces: true
    rune_infer:
      model_type: cb
      conf_threshold: 0.2
  cv:
    bin_threshold: 70
    color_diff_thresh: 10
    rune_r_min_area: 1
    rune_r_max_area: 999999999
    rune_r_1x1ratio_tol: 0.7
    rune_r_fill_ratio_min: 0.1
    rune_pan_min_area: 10
    rune_pan_max_area: 99999999
    rune_pan_cluster_radius: 70
    rune_pan_max_square_ratio: 1.3

rune_tracker:
  lost_time_thres: 2.0
  tracking_thres: 10
  esekf_iter_num: 5
  q_xyz: [0.0001, 0.0001, 0.0001]
  q_yaw: 0.1
  q_roll: 10.0
  q_a: 0.00001
  q_w: 0.00001
  q_tau: 0.000001
  match_gate: 50.0
  voter_state_need_count: 50
  voter_mode_need_count: 20
  big_args_continue_time: 1.0
  r_sigma_pix_by_hand_length_ratio_cv: 0.05
  r_sigma_pix_by_hand_length_ratio_net: 0.2

rune_aimer:
  base_yaw_offset: -0.0
  base_pitch_offset: -0.5
  sample_total_time: 0.5
  sample_horizon: 10
  prediction_delay: -0.00
  max_yaw_acc: 100 
  max_pitch_acc: 50
  shooting_range_h: 0.12
  shooting_range_w: 0.12
  min_enable_pitch_deg: 0.25
  min_enable_yaw_deg: 0.25
  ballistic_trajectory:
    gravity: 9.8
    resistance: 0.092  # 0.0190(大弹丸)double k1_c = 0.47; double k1 = k1_c * 1.169 * (2 * M_PI * 0.02125 * 0.02125) / 2 / 0.041;
    compenstator_type: resistance

